name: Actualizar catálogo y publicar

on:
  workflow_dispatch:
  schedule:
    - cron: "20 7 * * *"
  push:
    branches: [main, master]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Sincronizar repositorios públicos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-catalog.mjs

      - name: Comprobar el catálogo
        run: node scripts/assert-catalog.mjs

      - name: Compilar el sitio
        run: npm run build

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Guardar el catálogo validado
        continue-on-error: true
        run: |
          git add public/catalog.json
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Actualiza el catálogo de repositorios [skip ci]"
          git push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
